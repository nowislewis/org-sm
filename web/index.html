<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>org-sm review</title>
<style>
  :root { --bg:#1e1e2e; --fg:#cdd6f4; --dim:#6c7086; --card:#313244;
           --again:#f38ba8; --hard:#fab387; --good:#a6e3a1; --easy:#94e2d5; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { margin:0; height:100%; }
  body { background:var(--bg); color:var(--fg); font:17px/1.6 -apple-system,system-ui,sans-serif;
         display:flex; flex-direction:column;
         padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
  header { padding:12px 16px; font-size:14px; color:var(--dim); border-bottom:1px solid var(--card); }
  .count { color:var(--good); font-weight:600; }
  main { flex:1; overflow-y:auto; padding:16px; }
  .title { font-size:15px; color:var(--dim); margin-bottom:12px; }
  .body { background:var(--card); border-radius:12px; padding:18px; white-space:pre-wrap;
          word-break:break-word; font-size:18px; }
  .cloze-hidden { background:var(--good); color:var(--bg); border-radius:5px; padding:0 8px; font-weight:600; }
  .cloze-shown { color:var(--good); font-weight:600; }
  .empty { text-align:center; color:var(--dim); margin-top:40vh; }
  footer { padding:12px 16px calc(12px + env(safe-area-inset-bottom)); }
  .btn-row { display:flex; gap:10px; }
  button { flex:1; border:0; border-radius:12px; padding:16px 0; font:600 17px inherit;
           color:var(--bg); cursor:pointer; touch-action:manipulation; }
  button:active { filter:brightness(.85); }
  button .sub { font-size:12px; font-weight:500; opacity:.75; margin-top:2px; }
  .again { background:var(--again); } .hard { background:var(--hard); }
  .good { background:var(--good); } .easy { background:var(--easy); }
  .plain { background:var(--card); color:var(--fg); }
</style>
</head>
<body>
<header>org-sm · <span class="count" id="count">–</span> due</header>
<main id="main"><div class="empty" id="empty">Loading…</div></main>
<footer id="footer"></footer>
<script>
const $ = id => document.getElementById(id);
let queue = [], card = null, revealed = false;

async function api(path, options) {
  const response = await fetch(path, options);
  const result = JSON.parse(await response.text());
  if (result.error) throw new Error(result.error);
  return result;
}
function post(path, params) {
  return api(path, {method:'POST', headers:{'Content-Type':'application/x-www-form-urlencoded'},
                    body:new URLSearchParams(params).toString()});
}
async function loadQueue() {
  queue = await api('/api/queue');
  $('count').textContent = queue.length;
  if (queue.length) await showCard(queue[0].id); else done();
}
async function showCard(id) {
  card = await api('/api/card/' + encodeURIComponent(id));
  revealed = false;
  render();
}
function done() {
  card = null;
  $('main').innerHTML = '<div class="empty">🎉 Done — nothing due</div>';
  $('footer').innerHTML = '';
}
function renderCloze(tokens) {
  return tokens.map(token => {
    if ('text' in token) return document.createTextNode(token.text);
    const span = document.createElement('span');
    span.className = revealed ? 'cloze-shown' : 'cloze-hidden';
    span.textContent = revealed ? '[' + token.cloze + ']' : '[___]';
    return span;
  });
}
function button(label, interval, className, action) {
  const element = document.createElement('button');
  element.className = className;
  element.onclick = action;
  element.innerHTML = '<div>' + label + '</div><div class="sub">' + (interval || '&nbsp;') + '</div>';
  return element;
}
function row(...buttons) {
  const element = document.createElement('div');
  element.className = 'btn-row'; element.append(...buttons); return element;
}
function render() {
  const main = $('main'); main.innerHTML = '';
  const title = document.createElement('div'); title.className = 'title'; title.textContent = card.title;
  const body = document.createElement('div'); body.className = 'body';
  if (card.type === 'cloze') body.append(...renderCloze(card.clozes)); else body.textContent = card.body;
  main.append(title, body);
  const footer = $('footer'); footer.innerHTML = '';
  if (card.type === 'cloze' && !revealed) {
    footer.append(row(button('Show', null, 'good', () => { revealed = true; render(); })));
  } else if (card.type === 'cloze') {
    const intervals = card.intervals || {};
    footer.append(row(button('Again', intervals.again, 'again', () => review({rating:'again'})),
                      button('Hard', intervals.hard, 'hard', () => review({rating:'hard'})),
                      button('Good', intervals.good, 'good', () => review({rating:'good'})),
                      button('Easy', intervals.easy, 'easy', () => review({rating:'easy'}))));
  } else {
    const intervals = card.intervals || {};
    footer.append(row(button('Reschedule', intervals.reschedule, 'good', () => review({action:'reschedule'})),
                      button('Postpone', null, 'hard', postpone),
                      button('Dismiss', null, 'plain', () => review({action:'dismiss'}))));
  }
}
async function postpone() {
  const input = prompt('Postpone days:', '7');
  if (input === null) return;
  const days = Number.parseInt(input, 10);
  if (!Number.isFinite(days) || days < 1) return;
  await review({action:'postpone', days});
}
async function review(params) {
  await post('/api/review/' + encodeURIComponent(card.id), params);
  queue.shift(); $('count').textContent = queue.length;
  if (queue.length) await showCard(queue[0].id); else done();
}
loadQueue().catch(error => { $('empty').textContent = 'Error: ' + error.message; });
</script>
</body>
</html>
